id: gpt-6-astra-ultrafast-pricing
role: pricing
modelId: gpt-6-astra
currency: USD
unit: per_1m_tokens
basis: api_list_price
serviceTier: ultrafast
rates:
  input: "60.00"
  output: "300.00"
  cacheRead: "6.00"
  cacheWrite: "75.00"
  reasoning:
    billedAs: output
tiers:
  - id: long-context
    label: "Above 272K input tokens; higher rates apply to the full request"
