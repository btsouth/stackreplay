id: gpt-6-1-sol-fast-pricing
role: pricing
modelId: gpt-6-1-sol
currency: USD
unit: per_1m_tokens
basis: api_list_price
serviceTier: fast
rates:
  input: "4.00"
  output: "20.00"
  cacheRead: "0.20"
  cacheWrite: "5.00"
  reasoning:
    billedAs: output
tiers:
  - id: long-context
    label: "Above 272K input tokens; higher rates apply to the full request"
    when:
      inputTokensAbove: 272000
    rates:
      input: "8.00"
      output: "30.00"
      cacheRead: "0.40"
      cacheWrite: "10.00"
      reasoning:
        billedAs: output
effectiveFrom: 2026-09-29
sources:
