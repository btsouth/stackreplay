id: github-copilot-max
role: plan
name: Copilot Max
providerId: github
versions:
- effectiveFrom: '2026-09-22'
  price:
    currency: USD
    amount: '100'
    interval: month
  billingMechanics: Copilot Max costs $100 USD per month and includes 20,000 monthly
    AI credits (10,000 base and 10,000 flex).
  limits:
  - id: monthly-ai-credits
    label: Monthly AI credits (20,000 credits = $200.00 at the documented $0.01 per
      credit)
    type: credit_pool
    amount: '200.00'
    exceed: allow_overage
    window:
      type: calendar
      unit: month
      timezone: UTC
  qualitativeLimits:
  - id: code-completions-and-next-edit-suggestions-unlim
    label: Code completions and next edit suggestions (unlimited)
    statement: Code completions and next edit suggestions are not billed in AI credits
      and remain unlimited for all paid plans.
    sourceUrl: https://docs.github.com/en/copilot/concepts/billing-and-usage/individuals/billing
  - id: credit-reset-behaviour-no-carryover
    label: Credit reset behaviour (no carryover)
    statement: Included AI credits do not carry over between months. Unused credits
      are forfeited, and your allowance resets to the full monthly amount at 00:00:00
      UTC on the first day of each calendar month.
    sourceUrl: https://docs.github.com/en/copilot/concepts/billing-and-usage/individuals/billing
  - id: what-happens-when-included-credits-are-exhausted
    label: What happens when included credits are exhausted
    statement: If your included credits are exhausted, you can continue working by
      setting a budget for additional usage . Note that additional usage may be capped
      , so to keep working, you'll need to pay off any additional usage you've already
      consumed in order to continue.
    sourceUrl: https://docs.github.com/en/copilot/concepts/billing-and-usage/individuals/billing
    topic: after_limit
  - id: model-availability-scope
    label: Model availability by plan
    statement: Model access follows the published per-plan model table. Availability
      can also depend on organization policy and client support.
    sourceUrl: https://docs.github.com/en/copilot/get-started/plans
  - id: priority-premium-models
    label: Priority premium model access
    statement: GitHub describes Copilot Max as providing priority access to premium
      models; no numeric priority guarantee is published.
    sourceUrl: https://docs.github.com/en/copilot/get-started/plans
