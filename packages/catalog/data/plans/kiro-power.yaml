id: kiro-power
role: plan
name: Kiro Power
providerId: kiro
versions:
- effectiveFrom: '2026-10-03'
  effectiveFromBasis: catalog_recorded
  price:
    currency: USD
    amount: '200'
    interval: month
  billingMechanics: Current monthly offer recorded on October 3, 2026. Kiro credits
    measure work rather than API dollars. The base task-credit debit formula is not
    published, so exact subscription capacity is not admitted for replay.
  limits: []
  qualitativeLimits:
  - id: included-usage
    label: Included usage
    statement: 10,000 provider credits per billing month. Credits vary with model
      multiplier and task complexity; the base task-credit debit formula is not published.
    sourceUrl: https://kiro.dev/pricing/
  - id: additional-credits
    label: Additional credits
    statement: Prepaid add-ons cost $0.04 per credit in packs from $5 to $100. Plan
      credits are consumed first; add-ons roll over monthly and each purchase expires
      12 months after purchase.
    sourceUrl: https://kiro.dev/docs/billing/add-on-credits/
    topic: after_limit
  - id: reset-and-rollover
    label: Reset and rollover
    statement: Included credits reset at the start of the billing month and do not
      roll over. Purchased add-ons roll over monthly until their 12-month expiry.
    sourceUrl: https://kiro.dev/docs/billing/
  - id: workflows
    label: Workflows
    statement: Workflows use the same Kiro credit model as other agent work; complexity
      affects usage and consumption appears in the existing account usage view. Kiro
      does not publish a separate workflow meter.
    sourceUrl: https://kiro.dev/pricing/
  - id: compatible-tools
    label: Compatible tools
    statement: Kiro IDE · Kiro CLI · Kiro Web · Kiro Crew · ACP-compatible IDEs ·
      CI/CD automation. Third-party automation harnesses are prohibited.
    sourceUrl: https://kiro.dev/pricing/
  - id: availability
    label: Availability
    statement: Individual paid plans are served from the commercial US geography.
      GPT-5.6 is US-served regardless of enterprise profile region; other models follow
      the documented profile geography. Availability remains subject to provider geography,
      client and account controls.
    sourceUrl: https://kiro.dev/docs/models/
  - id: model-access-scope
    label: Model access scope
    statement: The current paid matrix includes GPT-5.6 Sol, Terra and Luna; Claude
      Opus and Sonnet families through Opus 5.5 and Sonnet 5.5; DeepSeek 3.2; MiniMax
      M2.5 and M2.1; GLM-5; Qwen3 Coder Next; and Auto. Fable 5.1 is Enterprise-only
      and excluded. Auto does not publish one exact model identity.
    sourceUrl: https://kiro.dev/docs/models/
  modelRules:
  - model: gpt-5-6-sol
