      interval: month
    billingMechanics: Token allowance per calendar month; request windows throttle burst usage.
    limits:
      - id: monthly-tokens
        label: Monthly token allowance
        type: token_limit
        amount: "200000000"
        window:
          type: calendar
          unit: month
          timezone: UTC
