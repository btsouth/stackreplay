        pricingRef: example-medium-pricing
      - model: example-large
        pricingRef: example-large-pricing
        multiplier: "0.5"
    promotions:
      - id: medium-launch-promo
        label: Medium model launch promotion
        models:
          - example-medium
        multiplier: "0.5"
        effectiveFrom: 2026-09-01
        effectiveTo: 2026-09-30
