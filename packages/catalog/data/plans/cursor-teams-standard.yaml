id: cursor-teams-standard
role: plan
name: Cursor Teams Standard
providerId: cursor
versions:
- effectiveFrom: '2026-10-03'
  effectiveFromBasis: catalog_recorded
  price:
    currency: USD
    amount: '40'
    interval: month
  billingMechanics: Current monthly price is $40 per paid user. The yearly toggle
    shows $32 per user per month, but annual commitment details are not published.
    Each paid seat receives two usage pools whose absolute sizes are not published,
    so exact subscription capacity is not admitted for replay.
  limits: []
  qualitativeLimits:
  - id: included-usage
    label: Included usage
    statement: Two separate per-seat pools, Cursor Models and Other Models, provide
      monthly usage. Cursor does not publish the absolute size of either pool.
    sourceUrl: https://cursor.com/docs/account/teams/pricing
  - id: reset-and-rollover
    label: Reset and rollover
    statement: Each paid seat's pool resets at the start of the billing cycle. Usage
      does not transfer between members; no rollover term is published.
    sourceUrl: https://cursor.com/docs/account/teams/pricing
  - id: after-limit
    label: After the limit
    statement: On-demand usage is enabled by default and billed in arrears, with team
      spend controls available.
    sourceUrl: https://cursor.com/docs/account/teams/pricing
    topic: after_limit
  - id: cursor-token-rate
    label: Cursor Token Rate
    statement: Third-party model usage costs published model rates plus $0.25 per
      million tokens. The rate applies to input, output and cached tokens, including
      Auto and BYOK; Cursor Models are exempt.
    sourceUrl: https://cursor.com/docs/models-and-pricing
  - id: compatible-tools
    label: Compatible tools
    statement: Cursor editor and Agent · Cloud Agents and automations · Bugbot · team
      marketplace · centralized billing and administration · SAML/OIDC SSO.
    sourceUrl: https://cursor.com/docs/account/teams/pricing
  - id: account-scope
    label: Account scope
    statement: A Teams account can belong to one team at a time. A free admin-only
      seat has no Cursor access. No minimum-seat, trial, annual-commitment or country
      eligibility term is published.
    sourceUrl: https://cursor.com/docs/account/teams/setup
  - id: model-access-scope
    label: Model access scope
    statement: Named model access is plan- and organization-dependent. Auto chooses
      among supported models, but Cursor does not publish its exact request-to-model
      mapping.
    sourceUrl: https://cursor.com/docs/models-and-pricing
  modelRules:
  - model: claude-fable-5-1
  - model: claude-opus-5-5
  - model: claude-sonnet-5-5
