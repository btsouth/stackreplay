name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format, lint and import order (Biome)
        run: pnpm check
      - name: Design token contrast (WCAG)
        run: pnpm check:contrast
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        # Each package already uses Vitest workers. Avoid multiplying those
        # pools across the small hosted runner and starving filesystem tests.
        run: pnpm test --concurrency=1
      - name: Benchmark asset server test
        run: node --test apps/web/bench/runtime-bench-server.test.mjs
      - name: Build
        run: pnpm build
      - name: Generated catalog files are current
        run: git diff --exit-code -- packages/catalog/src/bundled-catalog.ts packages/catalog/src/decision-market.generated.ts

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        # Build the workspace dependencies too: the web app and its Worker import
        # the compiled schema, catalog and replay engine packages.
        run: pnpm --filter "@stackreplay/web..." build
      - name: Install Playwright browsers
        run: pnpm --filter @stackreplay/web exec playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        run: pnpm --filter @stackreplay/web test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
