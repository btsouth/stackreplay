name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    timeout-minutes: 20
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Format, lint and import order (Biome)
        run: pnpm check
      - name: Design token contrast (WCAG)
        run: pnpm check:contrast
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        # Each package already uses Vitest workers. Avoid multiplying those
        # pools across the small hosted runner and starving filesystem tests.
        run: pnpm test --concurrency=1
      - name: Benchmark asset server test
        run: node --test apps/web/bench/runtime-bench-server.test.mjs
      - name: Build
        run: pnpm build
      - name: Generated catalog files are current
        run: git diff --exit-code -- packages/catalog/src/bundled-catalog.ts packages/catalog/src/decision-market.generated.ts

  e2e:
    timeout-minutes: 20
    # The full Playwright suite in four parallel shards: every test still runs,
    # each runner keeps its usual load. It builds what it needs, so it does not
    # wait for Checks.
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Match the locked @playwright/test version. Browsers and OS libraries are
    # already present; apt mirror failures cannot stall each shard's setup.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.63.0'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Check browser image matches the locked test runner
        run: |
          pnpm --filter @stackreplay/web exec node -e '
            const actual = require("@playwright/test/package.json").version;
            if (actual !== process.env.PLAYWRIGHT_IMAGE_VERSION) {
              throw new Error(`Playwright ${actual} needs a matching container: update ci.yml image and PLAYWRIGHT_IMAGE_VERSION together.`);
            }
          '
      - name: Build web app
        # Build the workspace dependencies too: the web app and its Worker import
        # the compiled schema, catalog and replay engine packages.
        run: pnpm --filter "@stackreplay/web..." build
      - name: Run Playwright tests
        run: pnpm --filter @stackreplay/web test:e2e --shard=${{ matrix.shard }}/4
      - name: Build Workers app for public URL history regressions
        if: matrix.shard == 1
        run: pnpm --filter @stackreplay/web build:vinext
      - name: Run public URL history tests on Workers
        if: matrix.shard == 1
        env:
          STACKREPLAY_E2E_RUNTIME: workers
        run: >-
          pnpm --filter @stackreplay/web test:e2e e2e/public-offers.spec.ts e2e/providers.spec.ts
          --grep "detail client navigation|full sibling comparison|shared comparison normalization|provider discovery|shared provider role"
          --workers=2
      - name: Run update permalink and filter contracts on Workers
        if: matrix.shard == 1
        env:
          STACKREPLAY_E2E_RUNTIME: workers
        run: pnpm --filter @stackreplay/web test:e2e e2e/updates.spec.ts --workers=2
      - name: Run public update feed HTTP contracts on Workers
        if: matrix.shard == 1
        env:
          STACKREPLAY_E2E_RUNTIME: workers
        run: pnpm --filter @stackreplay/web test:e2e e2e/update-feeds.spec.ts --workers=2
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 7

  e2e-result:
    timeout-minutes: 10
    # One status for the whole browser suite.
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: All shards passed
        run: test "${{ needs.e2e.result }}" = "success"
